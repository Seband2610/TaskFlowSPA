<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | TaskFlowSPA</title>
  </head>

  <body
    class="min-h-screen bg-gradient-to-b from-sky-50 via-white to-blue-100 text-slate-800"
  >
    <main class="grid min-h-screen lg:grid-cols-[1fr_0.95fr]">
      <section class="flex items-center justify-center px-6 py-10">
        <div
          class="w-full max-w-xl rounded-[2rem] border border-blue-100 bg-white p-8 shadow-xl shadow-blue-100/70"
        >
          <div class="flex items-center justify-between">
            <a
              class="text-xl font-black tracking-tight text-blue-900"
              href="/src/views/home.html"
            >
              TaskFlowSPA
            </a>

            <a
              class="rounded-full border border-blue-200 px-4 py-2 text-sm font-semibold text-blue-700 hover:bg-blue-50"
              href="/src/views/register.html"
            >
              Registrarse
            </a>
          </div>

          <div class="mt-8">
            <p
              class="text-sm font-semibold uppercase tracking-[0.3em] text-blue-600"
            >
              Login
            </p>

            <h1 class="mt-2 text-4xl font-black tracking-tight text-slate-900">
              Bienvenid@
            </h1>

            <p class="mt-4 text-slate-600">
              Ingresa y organiza tus tareas.
            </p>
          </div>

          <form class="mt-8 grid gap-5">
            <div>
              <label
                class="mb-2 block text-sm font-medium text-slate-700"
                for="email"
              >
                Correo
              </label>

              <input
                id="email"
                type="email"
                placeholder="usuario@taskflow.com"
                class="w-full rounded-2xl border border-blue-100 bg-blue-50 px-4 py-3 text-slate-900 placeholder:text-slate-400 focus:border-blue-400 focus:outline-none"
              />
            </div>

            <div>
              <label
                class="mb-2 block text-sm font-medium text-slate-700"
                for="password"
              >
                Contraseña
              </label>

              <input
                id="password"
                type="password"
                placeholder="Ingresa tu contraseña"
                class="w-full rounded-2xl border border-blue-100 bg-blue-50 px-4 py-3 text-slate-900 placeholder:text-slate-400 focus:border-blue-400 focus:outline-none"
              />
            </div>

            <button
              id="btnLogin"
              type="button"
              class="inline-flex items-center justify-center rounded-2xl bg-blue-600 px-5 py-3 text-sm font-bold text-white hover:bg-blue-500"
            >
              Entrar
            </button>
          </form>
        </div>
      </section>

      <section
        class="hidden bg-blue-600 p-10 text-white lg:flex lg:flex-col lg:justify-center"
      >
        <div class="mx-auto max-w-lg">
          <p
            class="text-sm font-semibold uppercase tracking-[0.3em] text-blue-100"
          >
            TaskFlowSPA
          </p>

          <h2 class="mt-4 text-5xl font-black tracking-tight">
            Organiza tus tareas de forma simple.
          </h2>

          <ul class="mt-8 space-y-4 text-lg leading-8 text-blue-50">
            <li>Login con localStorage.</li>
            <li>Lista de tareas.</li>
            <li>Dashboard simple y rapido.</li>
          </ul>
        </div>
      </section>
    </main>

    <script type="module" src="../main.js"></script>
  </body>
</html>
