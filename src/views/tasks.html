<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mis tareas | TaskFlowSPA</title>
  </head>

  <body class="min-h-screen bg-sky-50 text-slate-800">
    <header class="border-b border-blue-100 bg-white/90 backdrop-blur">
      <div
        class="mx-auto flex max-w-6xl items-center justify-between px-6 py-4"
      >
        <a
          class="text-xl font-black text-blue-900"
          href="/src/views/home.html"
        >
          TaskFlowSPA
        </a>

        <nav class="hidden gap-3 md:flex">
          <a
            class="rounded-full px-4 py-2 text-sm font-semibold text-slate-600 hover:bg-blue-50 hover:text-blue-700"
            href="/src/views/dashboard.html"
          >
            Dashboard
          </a>

          <a
            class="rounded-full bg-blue-600 px-4 py-2 text-sm font-semibold text-white"
            href="/src/views/tasks.html"
          >
            Tareas
          </a>

          <a
            class="rounded-full px-4 py-2 text-sm font-semibold text-slate-600 hover:bg-blue-50 hover:text-blue-700"
            href="/src/views/profile.html"
          >
            Perfil
          </a>

          <a
            class="rounded-full px-4 py-2 text-sm font-semibold text-slate-600 hover:bg-blue-50 hover:text-blue-700"
            href="/src/views/admin.html"
          >
            Admin
          </a>

          <a
            id="logoutBtn"
            href="#"
            class="rounded-full px-4 py-2 text-sm font-semibold text-slate-600 hover:bg-blue-50 hover:text-blue-700 transition"
          >
            Logout
          </a>
        </nav>
      </div>
    </header>

    <main class="mx-auto max-w-6xl px-6 py-10">
      <section
        class="flex flex-col gap-4 rounded-[2rem] bg-blue-600 px-8 py-10 text-white md:flex-row md:items-end md:justify-between"
      >
        <div>
          <p
            class="text-sm font-semibold uppercase tracking-[0.3em] text-blue-100"
          >
            Mis tareas
          </p>

          <h1 class="mt-3 text-4xl font-black tracking-tight">
            Lista de tareas
          </h1>

          <p class="mt-4 max-w-2xl text-blue-50">
            Organiza y revisa tus tareas pendientes.
          </p>
        </div>

        <a
          class="inline-flex items-center justify-center rounded-2xl bg-white px-5 py-3 text-sm font-bold text-blue-700 hover:bg-blue-50"
          href="/src/views/dashboard.html"
        >
          Volver
        </a>
      </section>

      <section
        class="mt-8 rounded-3xl border border-blue-100 bg-white p-6 shadow-lg shadow-blue-50"
      >
        <div class="flex flex-col gap-3 md:flex-row">
          <input
            id="taskInput"
            type="text"
            placeholder="Nueva tarea"
            class="flex-1 rounded-2xl border border-blue-100 px-4 py-3 outline-none focus:border-blue-400"
          />

          <button
            id="addTaskBtn"
            class="rounded-2xl bg-blue-600 px-6 py-3 font-semibold text-white hover:bg-blue-700"
          >
            Agregar
          </button>
        </div>

        <ul id="taskList" class="mt-6 space-y-3"></ul>
      </section>
    </main>

    <script type="module" src="../main.js"></script>
  </body>
</html>
